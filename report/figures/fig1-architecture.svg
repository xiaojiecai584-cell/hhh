<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="800" fill="#ffffff"/>

  <text x="24" y="26" font-size="13" fill="#6b7280">Lindoway 上位机 · 系统总体原理图（设备端 — 上位机 — 分析服务）</text>

  <!-- 设备端 -->
  <rect x="24" y="42" width="852" height="170" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="42" y="66" font-size="13" fill="#6b7280">设备端（硬件 / 固件组负责，本稿只约定接口与数据格式）</text>

  <rect x="40" y="80" width="190" height="90" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="135" y="110" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">六轴 IMU</text>
  <text x="135" y="133" font-size="12.5" fill="#4b5563" text-anchor="middle">JY61P / MPU6050</text>
  <text x="135" y="153" font-size="12.5" fill="#4b5563" text-anchor="middle">角速度 + 加速度 · 50 Hz</text>

  <rect x="274" y="80" width="220" height="90" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="384" y="110" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">主控 MCU</text>
  <text x="384" y="133" font-size="12.5" fill="#4b5563" text-anchor="middle">MSPM0G3507（现申报稿）</text>
  <text x="384" y="153" font-size="12.5" fill="#4b5563" text-anchor="middle">或 ESP32-S3（代码注释新方案）</text>

  <rect x="538" y="80" width="200" height="90" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="638" y="110" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">BLE 从机（NUS）</text>
  <text x="638" y="133" font-size="12.5" fill="#4b5563" text-anchor="middle">6e400001-… 服务</text>
  <text x="638" y="153" font-size="12.5" fill="#4b5563" text-anchor="middle">广播名 Lindoway</text>

  <line x1="230" y1="125" x2="270" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="494" y1="125" x2="534" y2="125" stroke="#6b7280" stroke-width="2" marker-end="url(#arg)"/>
  <text x="42" y="200" font-size="12" fill="#9ca3af">电源：锂电池 + 3.3 V LDO　│　提示：蜂鸣器 / 振动马达 / OLED 小屏（均由 MCU 驱动）</text>

  <!-- 无线链路 -->
  <rect x="24" y="232" width="852" height="76" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="260" font-size="14" fill="#312e81" text-anchor="middle" font-weight="700">BLE 5.0 无线链路　｜　启动权在设备端</text>
  <text x="450" y="282" font-size="12.5" fill="#4338ca" text-anchor="middle">上行 0x01 姿态帧 50 Hz · 0x02 动作开始 · 0x80 ACK　　下行 0x83 停止采集</text>
  <text x="450" y="300" font-size="12" fill="#4338ca" text-anchor="middle">帧格式　AA │ Type │ Payload │ SUM │ 55　（多字节字段大端，SUM 为低 8 位累加）</text>

  <line x1="638" y1="170" x2="638" y2="228" stroke="#6366f1" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 上位机 -->
  <rect x="24" y="328" width="852" height="252" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="42" y="352" font-size="13" fill="#1e40af" font-weight="700">上位机（本稿负责）：纯前端 Web 应用 · Web Bluetooth + Zustand + 端侧判别算法</text>

  <rect x="40" y="364" width="270" height="196" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="56" y="390" font-size="14.5" font-weight="700" fill="#1e3a8a">① BLE 传输与协议栈</text>
  <text x="56" y="418" font-size="12.5" fill="#374151">· WebBluetoothTransport</text>
  <text x="56" y="440" font-size="12.5" fill="#374151">· 虚拟设备（#/debug 无硬件联调）</text>
  <text x="56" y="462" font-size="12.5" fill="#374151">· FrameParser 流式解帧</text>
  <text x="56" y="484" font-size="12.5" fill="#374151">· codec：0x01 / 0x02 / 0x80 / 0x83</text>
  <text x="56" y="506" font-size="12.5" fill="#374151">· SUM 校验 + 帧尾 0x55 复核</text>
  <text x="56" y="536" font-size="11.5" fill="#6b7280">BLETransport 接口：真机 / 虚拟可替换</text>

  <rect x="326" y="364" width="270" height="196" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="342" y="390" font-size="14.5" font-weight="700" fill="#1e3a8a">② 实时会话与在线计数</text>
  <text x="342" y="418" font-size="12.5" fill="#374151">· useBleStore：50 Hz 帧调度</text>
  <text x="342" y="440" font-size="12.5" fill="#374151">· RepCounter：互补滤波</text>
  <text x="342" y="462" font-size="12.5" fill="#374151">　＋峰谷自适应状态机</text>
  <text x="342" y="484" font-size="12.5" fill="#374151">· sampleRing ≤1000 点切片</text>
  <text x="342" y="506" font-size="12.5" fill="#374151">· 达标自动下发 0x83</text>
  <text x="342" y="536" font-size="11.5" fill="#6b7280">计数在本地完成，不依赖网络</text>

  <rect x="612" y="364" width="248" height="196" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="628" y="390" font-size="14.5" font-weight="700" fill="#1e3a8a">③ 组分析与报告</text>
  <text x="628" y="418" font-size="12.5" fill="#374151">· analyzeSet 逐次分析</text>
  <text x="628" y="440" font-size="12.5" fill="#374151">· 后端优先 / 本地规则回退</text>
  <text x="628" y="462" font-size="12.5" fill="#374151">· 五类错误码 + 四项评分</text>
  <text x="628" y="484" font-size="12.5" fill="#374151">· 报告 / 历史 / 数据仓库</text>
  <text x="628" y="506" font-size="12.5" fill="#374151">· 3D 等比例动作演示</text>
  <text x="628" y="536" font-size="11.5" fill="#6b7280">评分口径与后端逐项对齐</text>

  <line x1="314" y1="462" x2="322" y2="462" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="600" y1="462" x2="608" y2="462" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 服务端 -->
  <line x1="450" y1="580" x2="450" y2="608" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arg)"/>
  <text x="462" y="600" font-size="11.5" fill="#6b7280">HTTPS · JSON</text>

  <rect x="24" y="612" width="852" height="150" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="42" y="636" font-size="13" fill="#065f46" font-weight="700">服务与存储（可选后端；未配置时上位机完全离线可用）</text>

  <rect x="40" y="648" width="270" height="98" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="56" y="674" font-size="14" font-weight="700" fill="#065f46">Python FastAPI 分析后端</text>
  <text x="56" y="698" font-size="12" fill="#374151">/api/v1/motion/analyze</text>
  <text x="56" y="718" font-size="12" fill="#374151">/api/v1/coach/advice（大模型指导）</text>
  <text x="56" y="738" font-size="12" fill="#374151">/api/v1/actions</text>

  <rect x="326" y="648" width="270" height="98" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="342" y="674" font-size="14" font-weight="700" fill="#065f46">本地作业服务</text>
  <text x="342" y="698" font-size="12" fill="#374151">/api/collect　数据集采集与标注</text>
  <text x="342" y="718" font-size="12" fill="#374151">/api/review　　视觉评审</text>
  <text x="342" y="738" font-size="12" fill="#374151">/api/generate　动作生成</text>

  <rect x="612" y="648" width="248" height="98" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="628" y="674" font-size="14" font-weight="700" fill="#065f46">浏览器本地存储</text>
  <text x="628" y="698" font-size="12" fill="#374151">localStorage：</text>
  <text x="628" y="718" font-size="12" fill="#374151">历史成绩 / 身体数据</text>
  <text x="628" y="738" font-size="12" fill="#374151">自定义动作 / BLE 配置</text>

  <text x="24" y="788" font-size="12" fill="#9ca3af">注：设备端电路原理图不属于本稿范围；本图只约定接口、数据格式与职责边界。</text>
</svg>
