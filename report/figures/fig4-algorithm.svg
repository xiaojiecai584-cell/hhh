<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="a4g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="24" y="20" font-size="12.5" fill="#9ca3af">Lindoway 上位机 · 在线计数与代偿判别算法　（左栏：滤波与门限　右栏：状态机与判定）</text>

  <!-- 左栏 -->
  <rect x="135" y="34" width="200" height="38" rx="19" fill="#059669"/>
  <text x="235" y="59" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">repCounter.push(sample)</text>
  <line x1="235" y1="72" x2="235" y2="86" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <polygon points="55,148 235,108 415,148 235,188" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
  <text x="235" y="153" font-size="13" fill="#065f46" text-anchor="middle">dt 合法（≤500 ms）？</text>
  <line x1="235" y1="188" x2="235" y2="202" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>
  <text x="245" y="200" font-size="11" fill="#4b5563">是</text>
  <polyline points="55,148 28,148 28,562 36,562" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a4g)"/>
  <text x="34" y="140" font-size="11" fill="#6b7280">否</text>

  <rect x="55" y="204" width="360" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="235" y="227" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">互补滤波更新重力方向 ĝ</text>
  <text x="235" y="249" font-size="12" fill="#374151" text-anchor="middle">Rodrigues 旋转 ĝ·dt + 加速度计回拉（κ=0.04）</text>
  <line x1="235" y1="266" x2="235" y2="280" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="55" y="282" width="360" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="235" y="305" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">提取三个观测量</text>
  <text x="235" y="327" font-size="12" fill="#374151" text-anchor="middle">姿态改变量 d=∠(ĝ,ĝ_ref) · 平滑角速度 ω̄ · 位移 travel</text>
  <line x1="235" y1="344" x2="235" y2="358" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="55" y="360" width="360" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="235" y="383" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">停顿检测（每个样本都做）</text>
  <text x="235" y="405" font-size="12" fill="#374151" text-anchor="middle">|ω|&lt;30°/s 且 |a−1g|&lt;0.03g 持续 ≥400 ms → pauseObserved</text>
  <line x1="235" y1="422" x2="235" y2="436" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="55" y="438" width="360" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="235" y="461" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">静息噪声底 → 自适应门限</text>
  <text x="235" y="483" font-size="12" fill="#374151" text-anchor="middle">5 s 窗口 20 分位 ×3，钳位 30~80°/s（只允许上调）</text>

  <!-- 否分支说明 -->
  <rect x="40" y="538" width="378" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="52" y="558" font-size="11.5" fill="#92400e" font-weight="700">否：丢弃该样本</text>
  <text x="52" y="577" font-size="11.5" fill="#78350f">dt ≤ 0 直接丢弃；dt &gt; 500 ms 则重置重力参考与武装状态</text>

  <!-- 左栏 → 右栏 -->
  <polyline points="415,469 452,469 452,152 491,152" fill="none" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <!-- 右栏 -->
  <rect x="495" y="108" width="340" height="88" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="665" y="131" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">武装判定与本次重复的统计量</text>
  <text x="665" y="153" font-size="11.5" fill="#374151" text-anchor="middle">未武装：谷值跟随，原始 |ω| ≥ 12°/s 时武装并初始化</text>
  <text x="665" y="174" font-size="11.5" fill="#374151" text-anchor="middle">已武装：累积峰值 · 路径 ∫|ω|dt · 绕重力轴扭转 · 三轴波形</text>
  <line x1="665" y1="196" x2="665" y2="210" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="495" y="212" width="340" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="665" y="234" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">本次重复的边界判定（两种模式）</text>
  <text x="665" y="256" font-size="12" fill="#374151" text-anchor="middle">语法模式：底停顿 → 顶停顿 → 底停顿 才计一次</text>
  <text x="665" y="278" font-size="12" fill="#374151" text-anchor="middle">回落模式：回落到峰谷差 45% 且持续 ≥260 ms</text>
  <line x1="665" y1="292" x2="665" y2="306" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="495" y="308" width="340" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="665" y="331" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">accept()：三道判据</text>
  <text x="665" y="353" font-size="12" fill="#374151" text-anchor="middle">时长 0.7~15 s → 门限 或 模板相关 ≥0.6 → 剔离群</text>
  <line x1="665" y1="370" x2="665" y2="384" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="495" y="386" width="340" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/>
  <text x="665" y="409" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">计次：生成 RepEvent</text>
  <text x="665" y="431" font-size="12" fill="#374151" text-anchor="middle">行程角 · 峰值角速度 · 扭转比 · 代偿标志</text>
  <line x1="665" y1="448" x2="665" y2="462" stroke="#059669" stroke-width="1.7" marker-end="url(#a4)"/>

  <rect x="565" y="464" width="200" height="40" rx="20" fill="#059669"/>
  <text x="665" y="490" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">返回 RepEvent / null</text>

  <text x="24" y="612" font-size="11" fill="#9ca3af">注：参数取自 src/core/analysis/repCounter.ts 的 DEFAULT_REP_OPTIONS；形状模板来自 motionTemplates.ts（后端 build-templates 产物），</text>
  <text x="24" y="629" font-size="11" fill="#9ca3af">　　归一化相关 ≥0.6 时即使幅度未过门限也算一次；三轴各算一次取最大，以容忍左右手佩戴造成的轴向相反。</text>
</svg>
