<svg xmlns="http://www.w3.org/2000/svg" width="900" height="770" viewBox="0 0 900 770" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="900" height="770" fill="#ffffff"/>
  <text x="24" y="22" font-size="13" fill="#6b7280">Lindoway 上位机 · 软件分层架构（依赖只允许自上而下，核心算法与 UI 解耦）</text>

  <!-- L1 -->
  <rect x="24" y="34" width="842" height="112" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="40" y="56" font-size="13.5" font-weight="700" fill="#1e40af">① 表现层 · React 页面与可视化</text>
  <text x="850" y="56" font-size="11.5" fill="#6b7280" text-anchor="end">只消费状态，不含算法</text>
  <rect x="40" y="66" width="190" height="66" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="48" y="90" font-size="13.5" font-weight="700" fill="#111827">训练页</text>
  <text x="48" y="110" font-size="11.5" fill="#4b5563">连接 / 实时次数 / 不订阅 50 Hz</text>
  <rect x="244" y="66" width="190" height="66" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="252" y="90" font-size="13.5" font-weight="700" fill="#111827">锻炼报告页</text>
  <text x="252" y="110" font-size="11.5" fill="#4b5563">多维评分 / 错误分布 / 建议</text>
  <rect x="448" y="66" width="190" height="66" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="456" y="90" font-size="13.5" font-weight="700" fill="#111827">数据中心页</text>
  <text x="456" y="110" font-size="11.5" fill="#4b5563">历史组 / 累计容量 / 趋势</text>
  <rect x="652" y="66" width="190" height="66" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="660" y="90" font-size="13.5" font-weight="700" fill="#111827">3D 动作视图</text>
  <text x="660" y="110" font-size="11.5" fill="#4b5563">three.js 等比例人体模型</text>

  <line x1="441" y1="146" x2="441" y2="176" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- L2 -->
  <rect x="24" y="182" width="842" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="40" y="204" font-size="13.5" font-weight="700" fill="#5b21b6">② 状态层 · Zustand store（跨页面共享）</text>
  <text x="850" y="204" font-size="11.5" fill="#6b7280" text-anchor="end">高频帧不进 React state</text>
  <rect x="40" y="214" width="190" height="66" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="48" y="238" font-size="13.5" font-weight="700" fill="#111827">useBleStore</text>
  <text x="48" y="258" font-size="11.5" fill="#4b5563">会话状态 / 帧调度 / 计数</text>
  <rect x="244" y="214" width="190" height="66" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="252" y="238" font-size="13.5" font-weight="700" fill="#111827">useDataStore</text>
  <text x="252" y="258" font-size="11.5" fill="#4b5563">历史成绩 / 本地持久化</text>
  <rect x="448" y="214" width="190" height="66" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="456" y="238" font-size="13.5" font-weight="700" fill="#111827">useSubjectStore</text>
  <text x="456" y="258" font-size="11.5" fill="#4b5563">身体数据 / 佩戴侧别</text>
  <rect x="652" y="214" width="190" height="66" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="660" y="238" font-size="13.5" font-weight="700" fill="#111827">useApiConfigStore</text>
  <text x="660" y="258" font-size="11.5" fill="#4b5563">后端地址 / 超时 / 回退开关</text>

  <line x1="441" y1="294" x2="441" y2="324" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- L3 -->
  <rect x="24" y="330" width="842" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="40" y="352" font-size="13.5" font-weight="700" fill="#065f46">③ 领域层 · 纯函数，无 DOM / 无网络，可离线单测</text>
  <text x="850" y="352" font-size="11.5" fill="#6b7280" text-anchor="end">算法与 UI 解耦的关键层</text>
  <rect x="40" y="362" width="190" height="66" rx="7" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="48" y="386" font-size="13.5" font-weight="700" fill="#111827">RepCounter</text>
  <text x="48" y="406" font-size="11.5" fill="#4b5563">互补滤波 / 峰谷状态机</text>
  <rect x="244" y="362" width="190" height="66" rx="7" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="252" y="386" font-size="13.5" font-weight="700" fill="#111827">analyzeSet</text>
  <text x="252" y="406" font-size="11.5" fill="#4b5563">逐次分析 / 组内汇总</text>
  <rect x="448" y="362" width="190" height="66" rx="7" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="456" y="386" font-size="13.5" font-weight="700" fill="#111827">classifyMotion</text>
  <text x="456" y="406" font-size="11.5" fill="#4b5563">5 类错误码 / 4 项评分</text>
  <rect x="652" y="362" width="190" height="66" rx="7" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="660" y="386" font-size="13.5" font-weight="700" fill="#111827">motion/*</text>
  <text x="660" y="406" font-size="11.5" fill="#4b5563">3D 运动学 / 动作模板库</text>

  <line x1="441" y1="442" x2="441" y2="472" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- L4 -->
  <rect x="24" y="478" width="842" height="112" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="40" y="500" font-size="13.5" font-weight="700" fill="#9a3412">④ 协议与传输层 · 与设备通信的唯一出入口</text>
  <text x="850" y="500" font-size="11.5" fill="#6b7280" text-anchor="end">换硬件只改这一层</text>
  <rect x="40" y="510" width="190" height="66" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="48" y="534" font-size="13.5" font-weight="700" fill="#111827">FrameParser</text>
  <text x="48" y="554" font-size="11.5" fill="#4b5563">流式解帧 / 假帧头跳过 / 校验</text>
  <rect x="244" y="510" width="190" height="66" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="252" y="534" font-size="13.5" font-weight="700" fill="#111827">codec</text>
  <text x="252" y="554" font-size="11.5" fill="#4b5563">定长编码 / 大端 / 缩放</text>
  <rect x="448" y="510" width="190" height="66" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="456" y="534" font-size="13.5" font-weight="700" fill="#111827">BLETransport</text>
  <text x="456" y="554" font-size="11.5" fill="#4b5563">传输抽象：连接 / 发送 / 帧回调</text>
  <rect x="652" y="510" width="190" height="66" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="660" y="534" font-size="13" font-weight="700" fill="#111827">WebBluetooth</text>
  <text x="660" y="554" font-size="11.5" fill="#4b5563">＋ 虚拟设备双实现</text>

  <line x1="441" y1="590" x2="441" y2="620" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- L5 -->
  <rect x="24" y="626" width="842" height="100" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="40" y="648" font-size="13.5" font-weight="700" fill="#374151">⑤ 边界 · 外部依赖（可缺省：无后端时整机仍可离线完成计数与报告）</text>
  <rect x="40" y="658" width="190" height="54" rx="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="48" y="680" font-size="12.5" font-weight="700" fill="#111827">BLE GATT 设备</text>
  <text x="48" y="699" font-size="11.5" fill="#4b5563">NUS 服务 / 50 Hz 上行</text>
  <rect x="244" y="658" width="190" height="54" rx="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="252" y="680" font-size="12.5" font-weight="700" fill="#111827">FastAPI 分析后端</text>
  <text x="252" y="699" font-size="11.5" fill="#4b5563">analyze / coach advice</text>
  <rect x="448" y="658" width="190" height="54" rx="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="456" y="680" font-size="12.5" font-weight="700" fill="#111827">本地作业服务</text>
  <text x="456" y="699" font-size="11.5" fill="#4b5563">collect / review / generate</text>
  <rect x="652" y="658" width="190" height="54" rx="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="660" y="680" font-size="12.5" font-weight="700" fill="#111827">localStorage</text>
  <text x="660" y="699" font-size="11.5" fill="#4b5563">历史 / 配置持久化</text>

  <text x="24" y="752" font-size="12" fill="#9ca3af">注：上层只能依赖下层；领域层不感知任何 DOM、蓝牙或网络，因此计数与判别逻辑可用脚本离线回归。</text>
</svg>
