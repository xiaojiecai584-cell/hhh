<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="s1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/>
    </marker>
    <marker id="s2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="s3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="24" y="22" font-size="13" fill="#6b7280">Lindoway 上位机 · 一次训练的通信与数据流时序（启动权在设备端，上位机只等待与计数）</text>

  <!-- 生命线 -->
  <line x1="110" y1="100" x2="110" y2="556" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="350" y1="100" x2="350" y2="556" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="590" y1="100" x2="590" y2="556" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="810" y1="100" x2="810" y2="556" stroke="#059669" stroke-width="1.3" stroke-dasharray="5 4"/>

  <rect x="35" y="50" width="150" height="46" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="110" y="70" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">用户 / 训练页</text>
  <text x="110" y="87" font-size="11" fill="#4b5563" text-anchor="middle">React 界面</text>

  <rect x="275" y="50" width="150" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="70" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">上位机业务层</text>
  <text x="350" y="87" font-size="11" fill="#1e40af" text-anchor="middle">transport + store + 算法</text>

  <rect x="515" y="50" width="150" height="46" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.6"/>
  <text x="590" y="70" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">设备端 MCU</text>
  <text x="590" y="87" font-size="11" fill="#4b5563" text-anchor="middle">IMU + BLE 从机</text>

  <rect x="735" y="50" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <text x="810" y="70" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">后端 / 本地存储</text>
  <text x="810" y="87" font-size="11" fill="#065f46" text-anchor="middle">可选，失败即回退</text>

  <!-- ① -->
  <line x1="110" y1="126" x2="346" y2="126" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="118" y="120" font-size="11.5" fill="#1e3a8a">① 打开训练页 → 点击「连接设备」</text>

  <!-- ② -->
  <line x1="350" y1="160" x2="586" y2="160" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="358" y="154" font-size="11.5" fill="#1e3a8a">② requestDevice → GATT → NUS 订阅</text>

  <!-- ③ -->
  <line x1="590" y1="196" x2="354" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#s2)"/>
  <text x="362" y="190" font-size="11.5" fill="#374151">③ 0x02 动作开始（语音 / 倒计时）</text>

  <!-- ④ self -->
  <path d="M350,228 L410,228 L410,240 L354,240" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#s1)"/>
  <text x="420" y="238" font-size="11.5" fill="#1e3a8a">④ 新建 RepCounter（装模板 · 清空采样环）</text>

  <!-- ⑤ loop -->
  <rect x="352" y="262" width="246" height="66" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="360" y="276" font-size="10.5" fill="#b45309">loop　每 20 ms 一帧</text>
  <line x1="590" y1="294" x2="354" y2="294" stroke="#6b7280" stroke-width="1.6" marker-end="url(#s2)"/>
  <text x="362" y="288" font-size="11.5" fill="#374151">⑤ 0x01 姿态帧 50 Hz</text>
  <line x1="590" y1="318" x2="354" y2="318" stroke="#6b7280" stroke-width="1.6" marker-end="url(#s2)"/>

  <!-- ⑥ self -->
  <path d="M350,352 L410,352 L410,364 L354,364" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#s1)"/>
  <text x="420" y="362" font-size="11.5" fill="#1e3a8a">⑥ 解帧 → 入环 → 计次 · 切样本</text>

  <!-- ⑦ -->
  <line x1="350" y1="396" x2="586" y2="396" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="358" y="390" font-size="11.5" fill="#1e3a8a">⑦ 0x83 停止采集（达标 / 手动 / 断连）</text>

  <!-- ⑧ -->
  <line x1="350" y1="432" x2="806" y2="432" stroke="#059669" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#s3)"/>
  <text x="358" y="426" font-size="11.5" fill="#065f46">⑧ POST /api/v1/motion/analyze（逐次重复，≥32 点）</text>

  <!-- ⑨ -->
  <line x1="810" y1="468" x2="354" y2="468" stroke="#059669" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#s3)"/>
  <text x="362" y="462" font-size="11.5" fill="#065f46">⑨ 评分 / 五类错误码 / 信号质量</text>

  <!-- ⑩ -->
  <line x1="350" y1="504" x2="806" y2="504" stroke="#059669" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#s3)"/>
  <text x="358" y="498" font-size="11.5" fill="#065f46">⑩ 保存本组历史（localStorage，含逐次明细）</text>

  <!-- ⑪ -->
  <line x1="350" y1="540" x2="114" y2="540" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#s1)"/>
  <text x="122" y="534" font-size="11.5" fill="#1e3a8a">⑪ 渲染锻炼报告与多维评分</text>

  <text x="24" y="586" font-size="12" fill="#9ca3af">注：③ 由设备端发起，上位机不会主动下发开始指令（0x82 仅保留在调试站）；⑧⑩ 失败时静默降级，不影响本组计数与报告。</text>
</svg>
